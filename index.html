<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arenametrix, Support Decision Tree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111120;
    font-family: 'Segoe UI', Inter, Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrapper { width: 100%; max-width: 700px; }
  .header { text-align: center; margin-bottom: 28px; }
  .header .eyebrow { color: #888; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .header p { color: #555; font-size: 13px; }
  .breadcrumb { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; min-height: 20px; }
  .breadcrumb span { color: #444; font-size: 11px; }
  .breadcrumb span.active { color: #ccc; }
  .card { background: #1a1a2e; border: 1px solid #2a2a42; border-radius: 10px; padding: 24px; }
  .question { color: #e0e0f0; font-weight: 600; font-size: 15px; line-height: 1.6; padding: 14px 16px; background: #111120; border-radius: 6px; border: 1px solid #2a2a42; margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .option-btn { background: #111120; border: 1px solid #2a2a42; border-radius: 6px; color: #bbb; padding: 11px 16px; text-align: left; cursor: pointer; font-size: 13px; line-height: 1.5; font-family: inherit; transition: border-color 0.15s, color 0.15s; }
  .option-btn:hover { border-color: #555; color: #fff; }
  .action-box { background: #111120; border: 1px solid #3a3a55; border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; }
  .action-box .action-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #666; margin-bottom: 8px; }
  .action-box .action-title { color: #fff; font-weight: 700; font-size: 15px; margin-bottom: 10px; }
  .action-box .action-body { color: #999; font-size: 13px; line-height: 1.7; margin-bottom: 16px; }
  .action-box .action-body code { background: #1e1e30; color: #ccc; padding: 1px 6px; border-radius: 3px; font-family: 'Courier New', monospace; font-size: 12px; border: 1px solid #333; }
  .btn-action { background: #1e1e30; border: 1px solid #3a3a55; border-radius: 6px; color: #ccc; padding: 11px 20px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; width: 100%; text-align: left; transition: border-color 0.15s, color 0.15s; margin-bottom: 6px; }
  .btn-action:last-child { margin-bottom: 0; }
  .btn-action:hover { border-color: #555; color: #fff; }
  .result { background: #111120; border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; border: 1px solid #2a2a42; }
  .result .result-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #666; margin-bottom: 8px; }
  .result .result-title { color: #fff; font-weight: 700; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #2a2a42; padding-bottom: 10px; }
  .result .result-body { color: #aaa; font-size: 13px; line-height: 1.7; }
  .result .result-body code { background: #1e1e30; color: #ccc; padding: 1px 6px; border-radius: 3px; font-family: 'Courier New', monospace; font-size: 12px; border: 1px solid #333; }
  .nav { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .btn-back { background: transparent; border: 1px solid #2a2a42; color: #555; border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 12px; font-family: inherit; transition: color 0.15s, border-color 0.15s; }
  .btn-back:hover { color: #aaa; border-color: #444; }
  .btn-reset-link { display: block; text-align: center; margin-top: 16px; color: #444; font-size: 12px; cursor: pointer; background: none; border: none; font-family: inherit; text-decoration: underline; }
  .btn-reset-link:hover { color: #888; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="eyebrow">Arenametrix, Support</div>
    <h1>Support Decision Tree</h1>
    <p>Start with the ticket type to get the investigation steps</p>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="card" id="card"></div>
  <button class="btn-reset-link" id="reset-btn" style="display:none" onclick="reset()">Start over</button>
</div>

<script>
const tree = {
  q: "What area does the bug affect?",
  opts: [

          // Bug > Campaign
          {
            l: "Campaign or email",
            next: {
              action: true,
              label: "Step 1, Try to reproduce the bug yourself",
              title: "Always investigate before escalating",
              body: "Log into the client's tenant account. Try to reproduce the exact behaviour they reported. Do not escalate until you have attempted to reproduce it.",
              next: {
                q: "Were you able to reproduce the bug?",
                opts: [
                  {
                    l: "Yes, I can reproduce it",
                    next: {
                      action: true,
                      label: "Step 2, Check the Action Viewer",
                      title: "Look for list_sent and related actions",
                      body: "Filter by <code>Nom = list_sent</code> in the Action Viewer. Check the Status and read the Message field if 400. Also check <code>cron_itr_started</code> if the send was automated.",
                      next: {
                        q: "What does the Action Viewer show?",
                        opts: [
                          { l: "list_sent exists, Status 400", r: { label: "Inform Client", title: "Campaign rejected, data issue", body: "The send was attempted but rejected by the platform. Read the Message field for the exact reason (empty list, configuration error, etc.). Share the reason with the client and ask them to correct it." } },
                          { l: "list_sent exists, Status 200 but email not received", r: { label: "Check Brevo", title: "Send logged, issue is in delivery", body: "Arenametrix successfully triggered the send. The issue is on the Brevo side. Open Brevo campaign reports and check delivery status, bounces, and spam flags for the affected contacts." } },
                          { l: "No list_sent entry at all", r: { label: "Inform Client", title: "Send was never triggered", body: "No list_sent entry exists in the time window. The campaign was never triggered from Arenametrix. Ask the client to confirm whether they clicked Send, and on which list and environment." } },
                          { l: "cron_itr_started missing for an automated send", r: { label: "Escalate Tech", title: "Scheduler did not fire", body: "The cron job did not run at the expected time. This is a system-level failure. Escalate to tech with the expected schedule, time window, and tenant." } }
                        ]
                      }
                    }
                  },
                  {
                    l: "No, I cannot reproduce it",
                    r: { label: "Inform Client, Dev ticket if UX issue", title: "Bug not reproduced, check if UX improvement needed", body: "If the behaviour works correctly on your end, the bug may be environment-specific, browser-specific, or a one-off. Inform the client it is working correctly and ask them to retry. If there is a UX gap (e.g. missing loading indicator, unclear feedback), open a dev ticket for a UX improvement, not a bug fix." }
                  }
                ]
              }
            }
          },

          // Bug > Contact missing / modified
          {
            l: "Contact missing, deleted, or data changed unexpectedly",
            next: {
              action: true,
              label: "Step 1, Check the Action Viewer",
              title: "Look for deletion, anonymization, or update events",
              body: "Filter the Action Viewer by <code>contact_deleted</code>, <code>contacts_deleted</code>, <code>contact_anonymized</code>, or <code>contact_updated</code>. Set the time window around when the client last saw the contact correctly.",
              next: {
                q: "What does the Action Viewer show?",
                opts: [
                  { l: "contact_deleted / contacts_deleted, Author is a user", r: { label: "Inform Client", title: "A user deleted the contact manually", body: "Show the client the Author and timestamp. This is a user action, not a platform bug. Check whether contact_restored is available as an option." } },
                  { l: "contact_updated, Source is captain_hook, Author empty", next: {
                    action: true,
                    label: "Step 2, Investigate on the Brevo side",
                    title: "The change came from Brevo via captain_hook",
                    body: "The modification was triggered by a Brevo event. Open Brevo, find the contact, and check their event history and any recent imports or automations that may have overwritten the data.",
                    next: {
                      q: "What does Brevo show?",
                      opts: [
                        { l: "Two contacts share the same phone number (uniqueness conflict)", r: { label: "Inform Client", title: "Brevo uniqueness conflict, duplicate phone number", body: "Brevo uses phone number as a uniqueness key. If two contacts share the same number, Brevo cannot update the second one and the sync breaks. The contact will stop receiving updates. Ask the client to correct the duplicate phone number." } },
                        { l: "Nothing visible in Brevo", r: { label: "Escalate Tech", title: "Escalate, no clear cause found", body: "The Action Viewer shows a captain_hook update but Brevo shows nothing that explains it. Escalate to tech with the contact ID, the contact_updated log ID, and the Brevo contact URL." } }
                      ]
                    }
                  }},
                  { l: "contact_updated, Source is walnut, Author empty", next: {
                    q: "Is there a file_imported or data_source_imported entry just before?",
                    opts: [
                      { l: "Yes, an import preceded it", r: { label: "Inform Client", title: "Contact updated by an import", body: "The change was made as part of a file import. The imported file overwrote existing contact fields. Ask the client to review the imported file." } },
                      { l: "No, no import in that window", r: { label: "Escalate Tech", title: "Unexplained background modification", body: "A Walnut background process modified the contact with no clear trigger. Escalate with the contact_updated log ID and the contact ID." } }
                    ]
                  }},
                  { l: "No entry found at all", r: { label: "Escalate Tech", title: "Data changed with no log, data integrity issue", body: "The contact was modified or deleted but there is no log entry. The change bypassed the logging layer. Escalate immediately with the contact ID." } }
                ]
              }
            }
          },

          // Bug > List membership
          {
            l: "Contact missing from a list / wrong list membership",
            next: {
              action: true,
              label: "Step 1, Check the list type and segmentation",
              title: "Reproduce the segmentation yourself first",
              body: "Before opening the Action Viewer, log into the tenant and manually redo the segmentation to verify whether the criteria actually match the contact. Check the purchase history, dates, and criteria carefully.",
              next: {
                q: "Is the segmentation correct when you redo it manually?",
                opts: [
                  {
                    l: "No, the criteria are wrong or incomplete",
                    r: { label: "Inform Client", title: "Criteria issue, inform and correct", body: "The list criteria do not correctly capture the intended segment. Explain to the client what the criteria should be and help them correct the segmentation." }
                  },
                  {
                    l: "Yes, criteria seem correct but contact is still missing",
                    next: {
                      action: true,
                      label: "Step 2, Check Brevo notifications",
                      title: "Look for import or sync errors in Brevo",
                      body: "Open Brevo and check the notifications and import history for that contact. Look for errors that would explain why the contact was not pushed to Brevo or not added to the list, in particular check for uniqueness conflicts (duplicate phone number or email).",
                      next: {
                        q: "What does Brevo show?",
                        opts: [
                          { l: "Import error, duplicate phone number or email", r: { label: "Inform Client", title: "Brevo uniqueness conflict blocking the sync", body: "Brevo cannot import the contact because another contact shares the same phone number or email (uniqueness key). The contact exists in Arenametrix but cannot be pushed to Brevo and therefore cannot appear in the Brevo list. Ask the client to identify and correct the duplicate." } },
                          { l: "Contact was never pushed to Brevo", r: { label: "Escalate Tech", title: "Contact not synced to Brevo, escalate", body: "The contact exists in Arenametrix but was never pushed to Brevo. This is a sync issue. Escalate to tech with the contact ID and the list ID." } },
                          { l: "Nothing visible, old purchase may not have been re-evaluated", r: { label: "Escalate Tech", title: "Criteria re-evaluation issue, escalate", body: "The contact's purchase was made before the time window entered the evaluation period. The dynamic list may not have re-evaluated old purchases when the time window was reached. Escalate to tech with the contact ID, the list name, and the purchase date." } }
                        ]
                      }
                    }
                  }
                ]
              }
            }
          },

          // Bug > Import
          {
            l: "Import failed or data wrong after import",
            next: {
              action: true,
              label: "Step 1, Check the Action Viewer",
              title: "Filter by file_imported",
              body: "Filter the Action Viewer by <code>Nom = file_imported</code> for the time window when the client uploaded the file. Check the Status and Message field.",
              next: {
                q: "What does the Action Viewer show?",
                opts: [
                  { l: "No file_imported entry", r: { label: "Inform Client", title: "File was never submitted", body: "The platform never received the file. The client may not have confirmed the upload or used the wrong environment." } },
                  { l: "file_imported, Status 400", r: { label: "Inform Client", title: "File rejected, read Message field", body: "The file was received but rejected. Read the Message field for the exact reason (wrong format, missing columns, encoding issue). Share the details with the client." } },
                  { l: "file_imported, Status 200 but data is wrong", next: {
                    q: "Are there contact_updated entries with Status 400 after the import?",
                    opts: [
                      { l: "Yes, some rows have 400 errors", r: { label: "Inform Client", title: "Partial import, specific rows failed", body: "The file was accepted but individual rows were rejected. Check the Message field on each failing contact_updated entry to identify which fields are invalid. Ask the client to correct those rows and re-import." } },
                      { l: "No, all 200s but data is wrong", r: { label: "Escalate Tech", title: "Import succeeded but data is incorrect", body: "The import completed without errors but the resulting data is wrong. This is a processing bug inside Walnut (field mapping, transformation, overwrite logic). Escalate with the file_imported log ID and examples of incorrect data." } }
                    ]
                  }}
                ]
              }
            }
          },

          // Bug > Unexpected mass data change
          {
            l: "Unexpected data change on multiple contacts (consent, history, fields)",
            next: {
              action: true,
              label: "Step 1, Check the Action Viewer for the date range",
              title: "Look for bulk operations around the reported date",
              body: "Filter the Action Viewer by <code>contact_updated</code> or <code>contacts_anonymized</code> for the time window. Look for bulk operations, automated events, or anything with an empty Author that could explain a mass change.",
              next: {
                q: "Does the Action Viewer show anything unusual?",
                opts: [
                  {
                    l: "Nothing particular visible",
                    next: {
                      action: true,
                      label: "Step 2, Check Brevo contact history",
                      title: "Open Brevo and check the history of the affected contacts",
                      body: "For each affected contact, open their Brevo profile and check the event history (list additions, imports, and synchronisation events). Look for a common event around the reported date.",
                      next: {
                        q: "What does Brevo show?",
                        opts: [
                          { l: "All contacts share a common event around the date", r: { label: "Inform Client", title: "Likely manual or mass synchronisation event", body: "The shared consent history or field change across multiple contacts is most likely the result of a manual action (prod push, mass sync, or bulk import) that occurred around that date. Inform the client of the most probable cause." } },
                          { l: "Nothing visible in Brevo either", r: { label: "Escalate Tech", title: "No visible cause, escalate to tech", body: "Neither the Action Viewer nor Brevo explains the mass change. Escalate to tech with the list of affected contacts and the date of the change." } }
                        ]
                      }
                    }
                  },
                  { l: "Yes, bulk operation with empty Author visible", r: { label: "Escalate Tech", title: "Unexplained bulk automated operation", body: "A bulk automated action was logged in the Action Viewer with no user Author. This was a system-triggered mass operation. Escalate to tech with the log IDs and the time window." } }
                ]
              }
            }
          }

  ]
};

let history = [];
let current = tree;

function truncate(str, n) {
  const clean = str.replace(/<[^>]+>/g, '');
  const words = clean.split(' ');
  return words.length > n ? words.slice(0, n).join(' ') + '...' : clean;
}

function render() {
  const card = document.getElementById('card');
  const bc = document.getElementById('breadcrumb');
  const resetBtn = document.getElementById('reset-btn');

  bc.innerHTML = history.length === 0 ? '' : history.map((node, i) => {
    const label = node.q || node.title || node.label || '';
    return `<span class="${i === history.length-1 ? 'active' : ''}">${i > 0 ? '<span style="color:#333;margin:0 2px">›</span>' : ''}${truncate(label, 4)}</span>`;
  }).join('');

  resetBtn.style.display = history.length > 0 ? 'block' : 'none';

  const backBtn = history.length > 0 ? '<button class="btn-back" onclick="goBack()">Back</button>' : '';
  const startOver = '<button class="btn-back" onclick="reset()">Start over</button>';

  if (current.r) {
    const { label, title, body } = current.r;
    card.innerHTML = `
      <div class="result">
        <div class="result-label">${label}</div>
        <div class="result-title">${title}</div>
        <div class="result-body">${body}</div>
      </div>
      <div class="nav">${backBtn}${startOver}</div>`;
    return;
  }

  if (current.action) {
    const optionsHtml = current.next.opts
      ? current.next.opts.map((opt, i) => `<button class="btn-action" onclick="chooseFromAction(${i})">${opt.l}</button>`).join('')
      : `<button class="btn-action" onclick="confirmAction()">Done, continue</button>`;
    card.innerHTML = `
      <div class="action-box">
        <div class="action-label">${current.label}</div>
        <div class="action-title">${current.title}</div>
        <div class="action-body">${current.body}</div>
        ${current.next.opts ? '<div style="color:#666;font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;font-weight:700;">What do you find?</div>' : ''}
        ${optionsHtml}
      </div>
      ${history.length > 0 ? '<div class="nav">' + backBtn + '</div>' : ''}`;
    return;
  }

  const optionsHtml = current.opts.map((opt, i) =>
    `<button class="option-btn" onclick="choose(${i})">${opt.l}</button>`
  ).join('');
  card.innerHTML = `
    <div class="question">${current.q}</div>
    <div class="options">${optionsHtml}</div>
    ${history.length > 0 ? '<div class="nav">' + backBtn + '</div>' : ''}`;
}

function choose(i) {
  const opt = current.opts[i];
  history.push(current);
  if (opt.r) current = { r: opt.r };
  else current = opt.next;
  render();
}

function chooseFromAction(i) {
  const opt = current.next.opts[i];
  history.push(current);
  if (opt.r) current = { r: opt.r };
  else current = opt.next;
  render();
}

function confirmAction() {
  history.push(current);
  current = current.next;
  render();
}

function goBack() {
  if (history.length === 0) return;
  current = history.pop();
  render();
}

function reset() {
  history = [];
  current = tree;
  render();
}

render();
</script>
</body>
</html>
